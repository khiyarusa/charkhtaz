name: android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble debug APK and unsigned release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-build
          path: artifacts

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
          body: |
            CHARKHTAZ / چرخ‌تاز — automated Android build.

            - `app-debug.apk` is a debug-signed APK: installable, but not suitable for store submission.
            - `app-release.aab` is an **unsigned** release bundle. Uploading to Google Play requires
              signing with a private keystore that is intentionally not stored in this repository.

            Web build: `npm ci && npm run build`. Android: `npm run cap:sync`.
